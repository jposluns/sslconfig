name: Weekly link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Accepted non-2xx codes: 403 and 999 are bot-blocking responses from sites that refuse automated
          # clients (LinkedIn answers 999); 301/302 are redirects; 429 is rate limiting. A green sweep therefore
          # proves that every URL answered, not that every page was readable. The sweep is advisory for that reason.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/site
            --accept 200,201,204,301,302,403,429,999
            --exclude '[<>]'
            --exclude '\$'
            --exclude 'example\.(com|test)'
            --exclude 'app\.internal'
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            './*.md'
            './site/index.html'
            './site/llms.txt'

      - name: Report citations that have moved
        # Advisory, and deliberately after the link sweep. The sweep accepts 301 and 302, so a
        # citation that has moved passes it forever while pointing at a redirect; #16 and #17
        # were spent cleaning that up once it had spread across 82 citations. This step names
        # them while the redirect still says where the page went. It never fails the run.
        if: always()
        run: python3 tools/report_citation_drift.py
